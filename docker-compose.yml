services:
  neo4j:
    build: .
    container_name: neo4j-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_auth__enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,apoc.cypher.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*,apoc.cypher.*'
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
